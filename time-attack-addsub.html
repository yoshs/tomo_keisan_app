<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>タイムアタック① たし算/ひき算（20〜45もん）</title>
    <link rel="stylesheet" href="./styles.css?v=20261103-opt1" />
  </head>
  <body>
    <main class="container">
      <header class="header">
        <h1 class="title">タイムアタック①</h1>
        <p class="subtitle">たし算 / ひき算 / まぜる（20・30・45もん）</p>
        <nav class="top-nav">
          <a class="link" href="./index.html">メニューへ</a>
        </nav>
      </header>

      <section id="screen-setup" class="card">
        <h2 class="card-title">もんだいを えらぶ</h2>

        <div class="form-grid">
          <label class="field">
            <span class="field-label">がくねん（むずかしさ）</span>
            <select id="difficulty">
              <option value="1">1ねん（〜20）</option>
              <option value="2">2ねん（〜100）</option>
              <option value="3">3ねん（〜1000）</option>
            </select>
          </label>

          <label class="field">
            <span class="field-label">もんすう</span>
            <select id="count">
              <option value="20" selected>20もん</option>
              <option value="30">30もん</option>
              <option value="45">45もん</option>
            </select>
          </label>

          <label class="field">
            <span class="field-label">0のもんだい</span>
            <select id="zero">
              <option value="none">なし</option>
              <option value="some" selected>すこし</option>
              <option value="many">よく</option>
            </select>
          </label>

          <label class="field">
            <span class="field-label">しゅつだい</span>
            <select id="mode">
              <option value="add">たし算</option>
              <option value="sub">ひき算</option>
              <option value="mix">たし算・ひき算 まぜる</option>
            </select>
          </label>
        </div>

        <div class="actions">
          <button id="startBtn" class="btn btn-primary">スタート</button>
        </div>
        <p class="hint">画面のテンキーで こたえてね。</p>
      </section>

      <section id="screen-quiz" class="card hidden" aria-live="polite">
        <div class="status-row">
          <div class="status">
            <span id="progress">1 / 20</span>
            <span class="dot">•</span>
            <span class="timer">⏱ <span id="timer">0:00.00</span></span>
            <span class="dot">•</span>
            <span>ミス <span id="mistakes">0</span></span>
          </div>
          <button id="restartBtn" class="btn btn-ghost">やりなおし</button>
        </div>

        <div class="problem">
          <div id="problemText" class="problem-text">1 + 1 = ?</div>
        </div>

        <div class="answer-row">
          <input
            id="answerInput"
            type="text"
            inputmode="none"
            pattern="[0-9]*"
            readonly
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            class="answer-input"
            placeholder="こたえ"
            aria-label="こたえ"
          />
          <button id="submitBtn" class="btn btn-primary">こたえる</button>
        </div>

        <div id="numpad" class="numpad" aria-label="テンキー">
          <div class="numpad-grid" >
            <button type="button" class="numpad-key" data-value="1">1</button>
            <button type="button" class="numpad-key" data-value="2">2</button>
            <button type="button" class="numpad-key" data-value="3">3</button>
            <button type="button" class="numpad-key" data-value="4">4</button>
            <button type="button" class="numpad-key" data-value="5">5</button>
            <button type="button" class="numpad-key" data-value="6">6</button>
            <button type="button" class="numpad-key" data-value="7">7</button>
            <button type="button" class="numpad-key" data-value="8">8</button>
            <button type="button" class="numpad-key" data-value="9">9</button>
            <button type="button" class="numpad-key numpad-fn" data-action="clear">けす</button>
            <button type="button" class="numpad-key" data-value="0">0</button>
            <button type="button" class="numpad-key numpad-fn" data-action="backspace">←</button>
          </div>
        </div>

        <p id="feedback" class="feedback" aria-live="assertive"></p>
      </section>

      <section id="screen-result" class="card hidden">
        <h2 class="card-title">けっか</h2>
        <div class="result-summary">
          <div class="result-big">
            <span id="resultTime">0:00.00</span>
            <span class="result-unit">time</span>
          </div>
          <div class="result-small" id="resultDetail">ミス 0</div>
        </div>

        <div class="actions">
          <button id="againBtn" class="btn btn-primary">もういちど</button>
          <a class="btn btn-ghost" href="./index.html">メニューへ</a>
        </div>
      </section>

      <footer class="footer">
        <small>えらんだ もんすうを さいごまで といた じかん</small>
      </footer>
    </main>

    <script src="./timed-quiz.js?v=20261103-opt1" onerror="__scriptLoadError('timed-quiz.js')"></script>
    <script src="./time-attack-addsub.js?v=20261103-opt1" onerror="__scriptLoadError('time-attack-addsub.js')"></script>
  </body>
</html>
