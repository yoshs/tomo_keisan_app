<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>タイムアタック① たし算/ひき算（20〜45もん）</title>
    <link rel="stylesheet" href="./styles.css?v=20261105-patterns1" />
    <script src="./background.js?v=20261105-patterns1" defer></script>
  </head>
  <body>
    <main class="container">
      <header class="header">
        <h1 class="title">タイムアタック①</h1>
        <p class="subtitle">たし算 / ひき算 / まぜる（20・30・45もん）</p>
        <nav class="top-nav">
          <a class="link" href="./index.html?v=1.3">メニューへ</a>
        </nav>
      </header>

      <section id="screen-setup" class="card">
        <h2 class="card-title">もんだいを えらぶ</h2>

        <div class="form-grid">
          <label class="field">
            <span class="field-label">がくねん</span>
            <select id="difficulty">
              <option value="1">1ねん</option>
              <option value="2">2ねん</option>
              <option value="3">3ねん</option>
            </select>
          </label>

          <label class="field">
            <span class="field-label">もんだいすう</span>
            <select id="count">
              <option value="20" selected>20もん</option>
              <option value="30">30もん</option>
              <option value="45">45もん</option>
            </select>
          </label>

          <label class="field">
            <span class="field-label">0のもんだい</span>
            <select id="zero">
              <option value="none">なし</option>
              <option value="some" selected>すこし</option>
              <option value="many">よく</option>
            </select>
          </label>

          <label class="field">
            <span class="field-label">しゅつだい</span>
            <select id="mode">
              <option value="add">たし算</option>
              <option value="sub">ひき算</option>
              <option value="mix">たし算・ひき算 まぜる</option>
            </select>
          </label>
        </div>

        <div class="difficulty-control">
          <label class="field" for="level">
            <span class="field-label">むずかしさ <output id="levelValue" for="level">1</output></span>
            <input id="level" type="range" min="0" max="4" step="1" value="1" aria-describedby="levelDescription" />
          </label>
          <div class="difficulty-steps" aria-hidden="true"><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span></div>
          <p id="levelDescription" class="hint" aria-live="polite"></p>
        </div>

        <div class="actions">
          <button id="startBtn" class="btn btn-primary">スタート</button>
        </div>
        <p class="hint">せいかいで100てん！ 2かいれんぞくで1コンボ（1.1ばい）、3かいで2コンボ（1.2ばい）。まちがえると−50てん。</p>
        <p class="hint">画面のテンキーで こたえてね。</p>
      </section>

      <section id="screen-quiz" class="card hidden" aria-live="polite">
        <div class="status-row">
          <div class="status">
            <span id="progress">1 / 20</span>
            <span class="dot">•</span>
            <span class="timer">⏱ <span id="timer">0:00.00</span></span>
            <span class="dot">•</span>
            <span>ミス <span id="mistakes">0</span></span>
          </div>
          <button id="restartBtn" class="btn btn-ghost">やりなおし</button>
        </div>

        <div class="game-score" aria-label="とくてんとコンボ">
          <div><span class="score-caption">とくてん</span><strong id="livePoints">0</strong><span>てん</span></div>
          <div><strong id="liveCombo">0</strong><span>コンボ</span><span id="liveMultiplier" class="score-caption">×1.0</span></div>
        </div>

        <div class="problem">
          <div id="problemText" class="problem-text">1 + 1 = ?</div>
        </div>

        <div class="answer-row">
          <input
            id="answerInput"
            type="text"
            inputmode="none"
            pattern="[0-9]*"
            readonly
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            class="answer-input"
            placeholder="こたえ"
            aria-label="こたえ"
          />
          <button id="submitBtn" class="btn btn-primary">こたえる</button>
        </div>

        <div id="numpad" class="numpad" aria-label="テンキー">
          <div class="numpad-grid" >
            <button type="button" class="numpad-key" data-value="1">1</button>
            <button type="button" class="numpad-key" data-value="2">2</button>
            <button type="button" class="numpad-key" data-value="3">3</button>
            <button type="button" class="numpad-key" data-value="4">4</button>
            <button type="button" class="numpad-key" data-value="5">5</button>
            <button type="button" class="numpad-key" data-value="6">6</button>
            <button type="button" class="numpad-key" data-value="7">7</button>
            <button type="button" class="numpad-key" data-value="8">8</button>
            <button type="button" class="numpad-key" data-value="9">9</button>
            <button type="button" class="numpad-key numpad-fn" data-action="clear">けす</button>
            <button type="button" class="numpad-key" data-value="0">0</button>
            <button type="button" class="numpad-key numpad-fn" data-action="backspace">←</button>
          </div>
        </div>

        <p id="feedback" class="feedback" aria-live="assertive"></p>
      </section>

      <section id="screen-result" class="card hidden">
        <h2 class="card-title">けっか</h2>
        <div class="game-score game-score-result">
          <div><span class="score-caption">ごうけい</span><strong id="resultPoints">0</strong><span>てん</span></div>
          <div><span class="score-caption">さいこう</span><strong id="resultMaxCombo">0</strong><span>コンボ</span></div>
        </div>
        <div class="result-summary">
          <div class="result-big">
            <span id="resultTime">0:00.00</span>
            <span class="result-unit">time</span>
          </div>
          <div class="result-small" id="resultDetail">ミス 0</div>
        </div>

        <div class="actions">
          <button id="againBtn" class="btn btn-primary">もういちど</button>
          <a class="btn btn-ghost" href="./index.html?v=1.3">メニューへ</a>
        </div>
      </section>

      <footer class="footer">
        <small>えらんだ もんだいすうを さいごまで といた じかん</small>
      </footer>
    </main>

  </body>
</html>
