<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<title>算数アプリ 動作確認</title>
<pre id="report">実行中…</pre>
<script>
const report = document.getElementById("report");
const results = [];
const pause = (ms) => new Promise(resolve => setTimeout(resolve, ms));
function assert(value, message) { if (!value) throw new Error(message); }
async function openPage(name, width = 375) {
  const frame = document.createElement("iframe");
  frame.style.cssText = `width:${width}px;height:900px;border:0`;
  frame.src = `../${name}.html`;
  const loaded = new Promise(resolve => frame.onload = resolve);
  document.body.append(frame);
  await loaded;
  const d = frame.contentDocument;
  assert(!d.getElementById("fatalError"), `${name}: 起動エラー`);
  return { frame, d, $: id => d.getElementById(id) };
}
function input(page, id, value) {
  const el = page.$(id);
  el.value = String(value);
  el.dispatchEvent(new page.frame.contentWindow.Event("input", { bubbles: true }));
}
function keypad(page, value) {
  for (const digit of String(value)) page.d.querySelector(`[data-value="${digit}"]`).click();
}
function celebrationVisible(page) {
  const effect = page.d.querySelector(".correct-celebration");
  assert(effect && !effect.hidden, "正解アニメーションを表示");
  assert(!effect.classList.contains("is-encouragement"), "正解時はお祝いの演出");
  assert(page.frame.contentWindow.getComputedStyle(effect).pointerEvents === "none", "アニメーションが入力を妨げない");
  assert(page.d.querySelectorAll(".correct-celebration").length === 1, "アニメーションの要素を再利用");
}
function encouragementVisible(page) {
  const effect = page.d.querySelector(".correct-celebration.is-encouragement");
  assert(effect && !effect.hidden, "不正解時に励ます演出");
  assert(effect.querySelector(".encouragement-face"), "残念そうな表情");
  assert(effect.querySelector(".celebration-praise").textContent.length > 0, "励ましの言葉");
  assert(!effect.querySelector(".celebration-combo"), "不正解時は加点やコンボを表示しない");
  assert(page.frame.contentWindow.getComputedStyle(effect).pointerEvents === "none", "再回答を妨げない");
}
function liveScore(page, points, combo) {
  assert(page.$("livePoints").textContent === String(points), `得点は${points}`);
  assert(page.$("liveCombo").textContent === String(combo), `コンボは${combo}`);
  assert(page.$("liveMultiplier").textContent === `×${(1 + combo / 10).toFixed(1)}`, "コンボ倍率の表示");
}
function finalScore(page, points, maxCombo) {
  assert(page.$("resultPoints").textContent === String(points), `合計得点は${points}`);
  assert(page.$("resultMaxCombo").textContent === String(maxCombo), `最大コンボは${maxCombo}`);
  if (!page.$("screen-result").classList.contains("hidden")) {
    assert(page.d.querySelector(".ranking-entry"), "終了後にランキングを表示");
  }
}
function answer(text) {
  const [a, b] = text.match(/\d+/g).map(Number);
  return text.includes("×") ? a * b : text.includes("÷") ? a / b : text.includes("−") ? a - b : a + b;
}
function noOverflow(page, width) {
  const bad = [...page.d.querySelectorAll("body *")].filter(el => {
    const box = el.getBoundingClientRect();
    return box.width && (box.right > width + 1 || box.left < -1);
  });
  assert(!bad.length, `幅${width}: ${bad.map(el => el.id || el.className).join(",")} がはみ出す`);
}
async function timed(name, options = {}) {
  const p = await openPage(name);
  for (const [id, value] of Object.entries(options)) p.$(id).value = value;
  p.$("startBtn").click();
  liveScore(p, 0, 0);
  p.$("submitBtn").click();
  liveScore(p, 0, 0);
  input(p, "answerInput", 99999);
  liveScore(p, -50, 0);
  assert(p.$("mistakes").textContent === "1", "ミスを1回カウント");
  encouragementVisible(p);
  keypad(p, answer(p.$("problemText").textContent));
  celebrationVisible(p);
  liveScore(p, 50, 0);
  assert(!p.d.querySelector(".celebration-praise").textContent.includes("コンボ"), "1回目の正解ではコンボ演出なし");
  p.$("submitBtn").click();
  p.$("restartBtn").click();
  await pause(300);
  assert(p.$("progress").textContent.startsWith("1 /"), "再スタート時に古い遷移をキャンセル");
  liveScore(p, 0, 0);
  const count = Number(p.$("progress").textContent.split("/")[1]);
  const seen = new Set();
  for (let i = 0; i < count; i++) {
    const text = p.$("problemText").textContent;
    seen.add(text);
    assert(p.$("progress").textContent === `${i + 1} / ${count}`, "進捗");
    if (i === 2) {
      input(p, "answerInput", 99999);
      liveScore(p, 160, 0);
      encouragementVisible(p);
    }
    if (i === 0) {
      const value = String(answer(text));
      input(p, "answerInput", value.replace(/[0-9]/g, x => String.fromCharCode(x.charCodeAt(0) + 0xfee0)));
    } else keypad(p, answer(text));
    if (i === 0) liveScore(p, 100, 0);
    if (i === 1) liveScore(p, 210, 1);
    if (i === 2) liveScore(p, 260, 0);
    p.$("submitBtn").click();
    await pause(250);
  }
  assert(!p.$("screen-result").classList.contains("hidden"), "最後まで完了");
  assert(p.$("resultDetail").textContent === "ミス 1", "二重採点や余分なミスなし");
  finalScore(p, 210 + 100 * (count - 2) + 5 * (count - 2) * (count - 3) - 50, count - 3);
  if (name === "time-attack-kuku") assert(seen.size === 20, "九九の重複なし");
  p.$("againBtn").click();
  assert(p.$("progress").textContent.startsWith("1 /"), "もういちど");
  p.frame.remove();
}
async function practice() {
  const p = await openPage("practice");
  p.$("grade").value = "3";
  for (const id of ["opAdd", "opSub", "opMul", "opDiv"]) p.$(id).checked = true;
  p.$("questionCount").value = "10";
  p.$("startBtn").click();
  keypad(p, answer(p.$("problemText").textContent));
  p.$("submitBtn").click();
  p.$("submitBtn").click();
  celebrationVisible(p);
  p.$("restartBtn").click();
  await pause(700);
  assert(p.$("statusProgress").textContent === "1 / 10", "通常練習の古い遷移キャンセル");
  for (let i = 0; i < 10; i++) {
    keypad(p, answer(p.$("problemText").textContent) + (i === 0 ? 1 : 0));
    p.$("submitBtn").click();
    p.$("submitBtn").click();
    if (i === 0) encouragementVisible(p);
    await pause(700);
  }
  finalScore(p, 1210, 8);
  assert(p.$("mistakeList").children.length === 1, "間違えた問題の振り返り");
  p.$("backBtn").click();
  assert(!p.$("screen-setup").classList.contains("hidden"), "設定に戻る");
  p.frame.remove();
}
async function column() {
  const p = await openPage("time-attack-column-2digit");
  p.$("mode").value = "mix";
  p.$("startBtn").click();
  const a = Number(p.$("rowTop").textContent.trim());
  const bottom = p.$("rowBottom").textContent;
  const b = Number(bottom.match(/\d+/)[0]);
  const add = bottom.includes("+");
  if (add ? a % 10 + b % 10 >= 10 : a % 10 < b % 10) p.$(add ? "carryPlusBtn" : "carryMinusBtn").click();
  const value = add ? a + b : a - b;
  keypad(p, value % 10);
  assert(p.d.activeElement === p.$("ansTens"), "1の位から10の位へ移動");
  keypad(p, Math.floor(value / 10));
  p.$("restartBtn").click();
  await pause(300);
  assert(p.$("progress").textContent === "1 / 20", "筆算の再スタート");
  await finishColumn(p);
}
async function finishColumn(p) {
  for (let i = 0; i < 20; i++) {
    const a = Number(p.$("rowTop").textContent.trim());
    const bottom = p.$("rowBottom").textContent;
    const b = Number(bottom.match(/\d+/)[0]);
    const add = bottom.includes("+");
    if (add ? a % 10 + b % 10 >= 10 : a % 10 < b % 10) p.$(add ? "carryPlusBtn" : "carryMinusBtn").click();
    const value = add ? a + b : a - b;
    if (i === 2) {
      input(p, "ansOnes", (value + 1) % 10);
      input(p, "ansTens", Math.floor(value / 10));
      liveScore(p, 160, 0);
      encouragementVisible(p);
      p.d.querySelector('[data-action="clear"]').click();
      if (add ? a % 10 + b % 10 >= 10 : a % 10 < b % 10) p.$(add ? "carryPlusBtn" : "carryMinusBtn").click();
    }
    keypad(p, value % 10);
    keypad(p, Math.floor(value / 10));
    celebrationVisible(p);
    await pause(300);
  }
  assert(!p.$("screen-result").classList.contains("hidden"), "筆算を完了");
  assert(p.$("resultDetail").textContent === "ミス 1", "筆算の採点");
  finalScore(p, 3490, 17);
  p.frame.remove();
}
async function area(mode) {
  const p = await openPage("area-rectangle");
  p.$("unitMode").value = mode;
  p.$("count").value = "10";
  p.$("startBtn").click();
  for (let i = 0; i < 10; i++) {
    const t = Number(p.$("labelTate").textContent.match(/\d+/)[0]);
    const y = Number(p.$("labelYoko").textContent.match(/\d+/)[0]);
    if (i === 2) {
      keypad(p, t); keypad(p, y);
      input(p, "areaInput", t * y + 1);
      liveScore(p, 160, 0);
      encouragementVisible(p);
    }
    keypad(p, t);
    assert(p.d.activeElement === p.$("yokoInput"), "縦から横へ移動");
    keypad(p, y);
    assert(p.d.activeElement === p.$("areaInput"), "横から面積へ移動");
    keypad(p, t * y);
    assert(!p.$("resultBox").classList.contains("hidden"), "面積の正解表示");
    celebrationVisible(p);
    keypad(p, "123");
    assert(p.$("okCount").textContent === String(i + 1), "正解後の入力を無視");
    p.$("nextBtn").click();
  }
  assert(p.$("resultSummary").textContent === "10", "面積を完了");
  finalScore(p, 1240, 7);
  p.frame.remove();
}
async function areaExamples() {
  const p = await openPage("area-rectangle", 320);
  const w = p.frame.contentWindow;
  const originalRandom = w.Math.random;
  const labels = new Set();
  for (const unit of ["cm", "m"]) {
    p.$("unitMode").value = unit;
    const min = unit === "cm" ? 2 : 1;
    const range = 10 - min;
    for (let t = min; t <= 9; t++) {
      for (let y = min; y <= 9; y++) {
        const values = [(t - min + 0.5) / range, (y - min + 0.5) / range];
        w.Math.random = () => values.shift();
        p.$("startBtn").click();
        w.Math.random = originalRandom;
        const shape = p.$("rectShape");
        const width = Number(shape.getAttribute("width"));
        const height = Number(shape.getAttribute("height"));
        assert(Math.abs(width / height - y / t) < 1e-9, "図形の縦横比が問題の寸法と一致");
        const svgBox = p.$("rectSvg").getBoundingClientRect();
        for (const id of ["rectShape", "measureTate", "measureYoko", "labelTate", "labelYoko"]) {
          const box = p.$(id).getBoundingClientRect();
          assert(box.left >= svgBox.left && box.right <= svgBox.right && box.top >= svgBox.top && box.bottom <= svgBox.bottom, "図形と寸法ラベルが表示枠内に収まる");
        }
        keypad(p, t); keypad(p, y); keypad(p, t * y);
        const captions = p.d.querySelectorAll(".area-result-sub");
        assert(captions.length === 2, "比較対象の寸法を表示");
        labels.add(captions[0].textContent);
        const match = captions[1].textContent.match(/= ([0-9.]+) (cm²|m²)/);
        assert(match && match[2] === (unit === "cm" ? "cm²" : "m²"), "比較の単位");
        const ratio = t * y / Number(match[1]);
        assert(ratio >= 0.8 - 1e-9 && ratio <= 1.25 + 1e-9, "比較対象の面積が近い");
        noOverflow(p, 320);
      }
    }
  }
  assert(labels.size >= 15, "出題範囲に合う多様な例");
  p.frame.remove();
}
async function difficultyLevels() {
  const p = await openPage("time-attack-addsub", 320);
  const w = p.frame.contentWindow;
  const originalTimeout = w.setTimeout.bind(w);
  w.setTimeout = (callback, delay) => originalTimeout(callback, Math.min(delay, 0));
  const carry = (a, b, sub) => {
    while (a || b) {
      if (sub ? a % 10 < b % 10 : a % 10 + b % 10 >= 10) return true;
      a = Math.floor(a / 10); b = Math.floor(b / 10);
    }
    return false;
  };
  for (let grade = 1; grade <= 3; grade++) {
    for (let level = 0; level <= 4; level++) {
      p.$("difficulty").value = grade;
      p.$("level").value = level;
      p.$("level").dispatchEvent(new w.Event("input"));
      assert(p.$("levelValue").value === (level === 0 ? "0（せっていなし）" : String(level)), "スライダーの表示を更新");
      if (level === 0) assert(!p.$("zero").disabled, "設定なしでも0の頻度を設定できる");
      assert(p.$("levelDescription").textContent.length > 0, "難易度の説明");
      noOverflow(p, 320);
      for (const mode of ["add", "sub", "mix"]) {
        p.$("mode").value = mode;
        p.$("zero").value = "none";
        p.$("count").value = "20";
        p.$("startBtn").click();
        let additions = 0;
        const levelCounts = [0, 0, 0, 0];
        for (let i = 0; i < 20; i++) {
          const text = p.$("problemText").textContent;
          const [a, b] = text.match(/\d+/g).map(Number);
          const sub = text.includes("−");
          if (!sub) additions++;
          assert(mode === "mix" || sub === (mode === "sub"), "選択した演算");
          assert(!sub || a > b, "ひき算は負の答えを出さない");
          if (level === 0) {
            if (grade === 1) {
              assert(b >= 1 && b <= 9 && a <= 99, "1年生の範囲");
              if (a <= 9) levelCounts[!sub && a + b > 10 ? 1 : 0]++;
              else {
                assert(a >= 10, "2桁と1桁");
                if (carry(a, b, sub)) {
                  levelCounts[3]++;
                  if (sub && a >= 11 && a <= 18 && a - b < 10) levelCounts[1]++;
                } else levelCounts[2]++;
              }
            } else {
              const base = 10 ** (grade - 1);
              assert(a >= base && a < base * 10 && b < base * 10, "学年の範囲");
              levelCounts[(b < base ? 0 : 2) + Number(carry(a, b, sub))]++;
            }
          } else if (grade === 1 && level <= 2) {
            assert(b >= 1 && b <= 9, "1年生の小さい数");
            if (level === 1) assert(a <= 9 && (sub || a + b <= 10), "難易度1は1桁、和は10以内");
            else if (sub) assert(a >= 11 && a <= 18 && a - b < 10 && carry(a, b, true), "難易度2のくり下がり");
            else assert(a <= 9 && a + b > 10, "難易度2は1桁で和が10を超える");
          } else {
            const digits = Math.max(2, grade);
            assert(a >= 10 ** (digits - 1) && a < 10 ** digits, "学年に合う桁数");
            if (grade >= 2 && level >= 3) assert(b >= 10 ** (digits - 1) && b < 10 ** digits, "同じ桁数どうし");
            else assert(b >= 1 && b < 10 ** (digits - 1), "小さい桁との計算");
            assert(carry(a, b, sub) === (level % 2 === 0), "くりの有無が難易度と一致");
          }
          input(p, "answerInput", answer(text));
          await pause(5);
        }
        assert(!p.$("screen-result").classList.contains("hidden"), "全難易度で完走");
        if (mode === "mix") assert(additions === 10, "混合は半々");
        if (level === 0) assert(levelCounts.every(n => n >= 5), "設定なしは難易度1〜4を均等に含む");
      }
    }
  }
  p.frame.remove();
}
async function mascotsAndEndlessScore() {
  const p = await openPage("area-rectangle", 320);
  const w = p.frame.contentWindow;
  p.$("count").value = "0";
  p.$("startBtn").click();
  const animals = new Set();
  const cheers = new Set();
  let lastAnimal;
  let lastCheer;
  let seed = 83;
  const random = w.Math.random;
  w.Math.random = () => { seed = (1664525 * seed + 1013904223) >>> 0; return seed / 4294967296; };
  for (let i = 0; i < 100; i++) {
    w.TomoCommon.celebrateCorrect(3);
    const animal = p.d.querySelector(".celebration-mascot").textContent;
    const cheer = p.d.querySelector(".celebration-praise").firstChild.textContent;
    assert(animal !== lastAnimal && cheer !== lastCheer, "動物も言葉も連続で同じにしない");
    animals.add(animal); cheers.add(cheer);
    lastAnimal = animal; lastCheer = cheer;
    assert(p.d.querySelector(".celebration-combo").textContent === "3 コンボ！（＋130てん）", "コンボの演出");
    assert(p.d.querySelector(".celebration-praise .celebration-combo"), "コンボ数をセリフ内に表示");
    noOverflow(p, 320);
  }
  w.Math.random = random;
  assert(animals.size === 10 && cheers.size === 10, "動物10種類・言葉10種類");
  const t = Number(p.$("labelTate").textContent.match(/\d+/)[0]);
  const y = Number(p.$("labelYoko").textContent.match(/\d+/)[0]);
  keypad(p, t); keypad(p, y); keypad(p, t * y);
  liveScore(p, 100, 0);
  p.$("finishBtn").click();
  assert(!p.$("screen-result").classList.contains("hidden"), "むげん練習も結果を表示");
  finalScore(p, 100, 0);
  p.$("againBtn").click();
  liveScore(p, 0, 0);
  finalScore(p, 0, 0);
  p.frame.remove();
}
async function reactionTiming() {
  const p = await openPage("area-rectangle", 320);
  const w = p.frame.contentWindow;
  w.TomoCommon.encourageWrong();
  const wrongSize = Number.parseFloat(w.getComputedStyle(p.d.querySelector(".celebration-mascot")).fontSize);
  const wrongTextSize = Number.parseFloat(w.getComputedStyle(p.d.querySelector(".celebration-praise")).fontSize);
  await pause(600);
  encouragementVisible(p);
  noOverflow(p, 320);
  w.TomoCommon.celebrateCorrect(12);
  celebrationVisible(p);
  const mascot = p.d.querySelector(".celebration-mascot");
  assert(Number.parseFloat(w.getComputedStyle(mascot).fontSize) > wrongSize, "正解キャラクターは大きく表示");
  assert(Number.parseFloat(w.getComputedStyle(p.d.querySelector(".celebration-praise")).fontSize) > wrongTextSize, "正解のセリフも大きく表示");
  assert(w.getComputedStyle(mascot).animationDuration === "0.8s", "アニメーションは0.8秒");
  await pause(600);
  celebrationVisible(p);
  noOverflow(p, 320);
  await pause(250);
  assert(p.d.querySelector(".correct-celebration").hidden, "0.8秒後に非表示");
  p.frame.remove();
}
async function unavailableStorage() {
  const p = await openPage("practice");
  const html = p.d.documentElement.outerHTML;
  const base = new URL("../", location.href).href;
  const ready = new Promise(resolve => p.frame.onload = resolve);
  p.frame.srcdoc = html.replace("<head>", `<head><base href="${base}"><script>Object.defineProperty(window, "localStorage", { get() { throw new Error("Storage blocked"); } });<` + "/script>");
  await ready;
  const d = p.frame.contentDocument;
  assert(!d.getElementById("fatalError"), "保存が使えなくても起動");
  d.getElementById("startBtn").click();
  assert(!d.getElementById("screen-quiz").classList.contains("hidden"), "保存が使えなくても開始");
  const w = p.frame.contentWindow;
  const originalTimeout = w.setTimeout.bind(w);
  w.setTimeout = (callback, delay) => originalTimeout(callback, Math.min(delay, 0));
  const q = { frame: p.frame, d, $: id => d.getElementById(id) };
  for (let i = 0; i < 10; i++) {
    input(q, "answerInput", answer(q.$("problemText").textContent));
    q.$("submitBtn").click();
    await pause(5);
  }
  assert(!q.$("screen-result").classList.contains("hidden"), "保存不可でも最後まで完了");
  assert(d.querySelector(".rankings-note").textContent.includes("ほぞんできません"), "保存不可を結果に表示");
  p.frame.remove();
}
async function rankings() {
  const p = await openPage("area-rectangle", 320);
  const w = p.frame.contentWindow;
  const memory = new Map();
  const storage = { getItem: key => memory.get(key) ?? null, setItem: (key, value) => memory.set(key, value) };
  Object.defineProperty(w, "localStorage", { configurable: true, value: storage });
  p.$("count").value = "10";
  const board = w.TomoRankings.create();
  function save(points, maxCombo, elapsedMs = null) {
    board.start();
    board.finish({ points, maxCombo }, { elapsedMs });
  }
  function rows() { return [...p.d.querySelectorAll(".ranking-entry")]; }
  function scores() { return rows().map(row => Number.parseInt(row.querySelector(".ranking-points").textContent, 10)); }
  save(500, 2, 10000);
  const key = [...memory.keys()][0];
  assert(JSON.parse(memory.get(key)).length === 1, "得点を保存");
  board.finish({ points: 9999, maxCombo: 99 });
  assert(JSON.parse(memory.get(key)).length === 1, "同じ終了処理では二重保存しない");
  save(500, 3, 20000);
  assert(rows()[0].classList.contains("is-current"), "同点は最大コンボで順位付け");
  save(500, 3, 10000);
  assert(rows()[0].classList.contains("is-current"), "同点・同コンボは短いタイム順");
  for (let i = 1; i <= 12; i++) save(i * 1000, i);
  assert(rows().length === 10 && scores()[0] === 12000 && scores()[9] === 3000, "上位10件に絞る");
  save(-50, 0);
  assert(!rows().some(row => row.classList.contains("is-current")), "トップ10外を正しく表示");
  noOverflow(p, 320);
  const ready = new Promise(resolve => p.frame.onload = resolve);
  w.location.reload();
  await ready;
  const d = p.frame.contentDocument;
  const loadedWindow = p.frame.contentWindow;
  Object.defineProperty(loadedWindow, "localStorage", { configurable: true, value: storage });
  d.getElementById("count").value = "10";
  const loaded = loadedWindow.TomoRankings.create();
  loaded.start(); loaded.finish({ points: 100, maxCombo: 0 });
  assert(d.querySelectorAll(".ranking-entry").length === 10, "開き直しても保存した記録を表示");
  d.getElementById("count").value = "20";
  loaded.start(); loaded.finish({ points: 700, maxCombo: 4 });
  assert(d.querySelectorAll(".ranking-entry").length === 1 && memory.size === 2, "問題数の異なる記録を分ける");
  d.getElementById("count").value = "10";
  memory.set(key, "invalid json");
  loaded.start(); loaded.finish({ points: -50, maxCombo: 0 });
  assert(JSON.parse(memory.get(key))[0].points === -50, "壊れた保存データから復旧し、負の点も保存");
  storage.setItem = () => { throw new Error("Storage full"); };
  loaded.start(); loaded.finish({ points: 800, maxCombo: 5 });
  assert([...d.querySelectorAll(".rankings-note")].some(el => el.textContent.includes("ほぞんできません")), "容量不足でも結果を表示");
  noOverflow({ d }, 320);
  p.frame.remove();
}
async function rankingResultFallback() {
  const p = await openPage("time-attack-addsub", 320);
  const w = p.frame.contentWindow;
  const memory = new Map();
  Object.defineProperty(w, "localStorage", { configurable: true, value: {
    getItem: key => memory.get(key) ?? null,
    setItem: (key, value) => memory.set(key, value),
  } });
  const score = w.TomoCommon.createScoreboard();
  score.reset();
  score.record(true); score.record(true);
  p.$("resultTime").textContent = "0:12.34";
  // 古いモード処理のように、finishを呼ばずに結果画面だけ表示する。
  p.$("screen-setup").classList.add("hidden");
  p.$("screen-result").classList.remove("hidden");
  await pause(20);
  assert(p.d.querySelectorAll("#rankingsResult").length === 1, "ランキング欄が必ず1つ存在する");
  assert(p.d.querySelectorAll(".ranking-entry").length === 1, "結果表示を検知してランキングを表示");
  assert(memory.size === 1, "結果画面から保存できる");
  const stored = JSON.parse([...memory.values()][0]);
  assert(stored[0].points === 210 && stored[0].elapsedMs === 12340, "得点・タイムを正しく保存");
  score.finish({ elapsedMs: 12340 });
  assert(JSON.parse([...memory.values()][0]).length === 1, "通常処理と併用しても二重保存しない");
  noOverflow(p, 320);
  p.frame.remove();
}
async function backgrounds() {
  const themes = ["dots", "stars", "hearts", "flowers", "clouds", "gingham"];
  for (const name of ["index", "practice", "time-attack-addsub", "time-attack-kuku", "time-attack-mix-add-kuku", "time-attack-column-2digit", "area-rectangle"]) {
    const p = await openPage(name, 320);
    const theme = p.d.documentElement.dataset.background;
    assert(themes.includes(theme), "全ページに背景柄を設定");
    const ready = new Promise(resolve => p.frame.onload = resolve);
    p.frame.contentWindow.location.reload();
    await ready;
    const d = p.frame.contentDocument;
    assert(themes.includes(d.documentElement.dataset.background) && d.documentElement.dataset.background !== theme, "開き直すと前回と異なる柄");
    for (const value of themes) {
      d.documentElement.dataset.background = value;
      assert(p.frame.contentWindow.getComputedStyle(d.body).backgroundImage !== "none", "6種類の柄が表示できる");
      noOverflow({ d }, 320);
    }
    p.frame.remove();
  }
}
async function layouts() {
  for (const width of [320, 360, 375, 390, 414, 540, 768]) {
    for (const name of ["index", "practice", "time-attack-addsub", "time-attack-kuku", "time-attack-mix-add-kuku", "time-attack-column-2digit", "area-rectangle"]) {
      const p = await openPage(name, width);
      noOverflow(p, width);
      if (p.$("startBtn")) { p.$("startBtn").click(); noOverflow(p, width); }
      p.frame.remove();
    }
  }
}
(async () => {
  const checks = [
    ["6種類の背景柄と開き直した際の切り替え", backgrounds],
    ["全ページの表示（320〜768px）", layouts],
    ["ランキングの保存・順位・条件分け・保存失敗", rankings],
    ["古いモード処理でも結果画面にランキング表示", rankingResultFallback],
    ["たし算20問", () => timed("time-attack-addsub", { mode: "add", count: "20", zero: "none" })],
    ["ひき算30問", () => timed("time-attack-addsub", { mode: "sub", count: "30", difficulty: "2", zero: "many" })],
    ["たしひき混合45問", () => timed("time-attack-addsub", { mode: "mix", count: "45", difficulty: "3" })],
    ["九九20問", () => timed("time-attack-kuku")],
    ["たし算＋九九20問", () => timed("time-attack-mix-add-kuku")],
    ["通常練習・連打・振り返り", practice],
    ["設定保存が使えない環境", unavailableStorage],
    ["3学年×5難易度×3演算の出題条件", difficultyLevels],
    ["筆算・繰り上がり・繰り下がり", column],
    ["面積cm", () => area("cm")],
    ["面積m", () => area("m")],
    ["ランダムな動物・言葉とむげん練習の得点", mascotsAndEndlessScore],
    ["演出の表示時間と正解時のサイズ", reactionTiming],
    ["面積の全145通りと大きさの例", areaExamples],
  ];
  for (const [name, run] of checks) {
    try { await run(); results.push(`PASS ${name}`); }
    catch (error) { results.push(`FAIL ${name}: ${error.message}`); }
    report.textContent = results.join("\n");
  }
  document.title = results.some(x => x.startsWith("FAIL")) ? "FAIL" : "PASS";
})();
</script>
