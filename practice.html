<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>とも けいさん（れんしゅう）</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="container">
      <header class="header">
        <h1 class="title">とも けいさん</h1>
        <p class="subtitle">れんしゅう（ふつうモード）</p>

        <nav class="top-nav">
          <a class="link" href="./index.html">メニューへ</a>
        </nav>
      </header>

      <section id="screen-setup" class="card">
        <h2 class="card-title">せってい</h2>

        <div class="form-grid">
          <label class="field">
            <span class="field-label">がくねん</span>
            <select id="grade">
              <option value="1">1ねん</option>
              <option value="2">2ねん</option>
              <option value="3">3ねん</option>
            </select>
          </label>

          <label class="field">
            <span class="field-label">もんだい すう</span>
            <select id="questionCount">
              <option value="10">10もん</option>
              <option value="20">20もん</option>
              <option value="30">30もん</option>
            </select>
          </label>
        </div>

        <fieldset class="ops" aria-label="れんしゅうする けいさん しゅるい">
          <legend class="ops-title">けいさんの しゅるい</legend>

          <label class="checkbox">
            <input id="opAdd" type="checkbox" value="+" />
            <span>たしざん（＋）</span>
          </label>

          <label class="checkbox">
            <input id="opSub" type="checkbox" value="-" />
            <span>ひきざん（−）</span>
          </label>

          <label class="checkbox">
            <input id="opMul" type="checkbox" value="×" />
            <span>かけざん（×）</span>
          </label>

          <label class="checkbox">
            <input id="opDiv" type="checkbox" value="÷" />
            <span>わりざん（÷）</span>
          </label>
        </fieldset>

        <div class="actions">
          <button id="startBtn" class="btn btn-primary">はじめる</button>
        </div>

        <p class="hint">ヒント：Enterキーでも こたえられます。</p>
      </section>

      <section id="screen-quiz" class="card hidden" aria-live="polite">
        <div class="status-row">
          <div class="status">
            <span id="statusProgress">1 / 10</span>
            <span class="dot">•</span>
            <span id="statusScore">0てん</span>
          </div>
          <button id="restartBtn" class="btn btn-ghost">やりなおし</button>
        </div>

        <div class="problem">
          <div id="problemText" class="problem-text">1 + 1 = ?</div>
        </div>

        <div class="answer-row">
          <input
            id="answerInput"
            type="tel"
            inputmode="numeric"
            pattern="[0-9]*"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            class="answer-input"
            placeholder="こたえ"
            aria-label="こたえ"
          />
          <button id="submitBtn" class="btn btn-primary">こたえる</button>
        </div>

        <div id="numpad" class="numpad" aria-label="テンキー">
          <div class="numpad-grid" aria-hidden="true">
            <button type="button" class="numpad-key" data-value="1">1</button>
            <button type="button" class="numpad-key" data-value="2">2</button>
            <button type="button" class="numpad-key" data-value="3">3</button>
            <button type="button" class="numpad-key" data-value="4">4</button>
            <button type="button" class="numpad-key" data-value="5">5</button>
            <button type="button" class="numpad-key" data-value="6">6</button>
            <button type="button" class="numpad-key" data-value="7">7</button>
            <button type="button" class="numpad-key" data-value="8">8</button>
            <button type="button" class="numpad-key" data-value="9">9</button>
            <button type="button" class="numpad-key numpad-fn" data-action="clear">けす</button>
            <button type="button" class="numpad-key" data-value="0">0</button>
            <button type="button" class="numpad-key numpad-fn" data-action="backspace">←</button>
          </div>
        </div>

        <p id="feedback" class="feedback" aria-live="assertive"></p>
      </section>

      <section id="screen-result" class="card hidden">
        <h2 class="card-title">けっか</h2>

        <div class="result-summary">
          <div class="result-big">
            <span id="resultScore">0</span>
            <span class="result-unit">てん</span>
          </div>
          <div class="result-small" id="resultDetail">10もん中 0もん せいかい</div>
        </div>

        <div id="mistakes" class="mistakes hidden">
          <h3 class="mistakes-title">まちがえた もんだい</h3>
          <ol id="mistakeList" class="mistake-list"></ol>
        </div>

        <div class="actions">
          <button id="againBtn" class="btn btn-primary">もういちど</button>
          <button id="backBtn" class="btn btn-ghost">せっていに もどる</button>
        </div>
      </section>

      <footer class="footer">
        <small>オフラインで動くシンプル版（HTML/JS）</small>
      </footer>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
